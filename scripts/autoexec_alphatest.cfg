// Tremulous WXR - AlphaTest build defaults.
//
// autoexec.cfg is exec'd by Com_ExecuteCfg AFTER default.cfg and
// q3config.cfg, so it wins over a saved config on the test device -- which
// is the usual reason a changed default appears not to take effect.
//
// vr_enable is CVAR_LATCH, and this runs before CL_Init, so it latches in
// time for the XrApi client to start on the first frame.
//
// The compiled-in default stays 0 on purpose: the project rule is that
// `vr_enable 0` produces a bit-identical flat game, and a test build turning
// VR on for convenience should not quietly rewrite that guarantee. Delete
// this file and you have the stock game back.

seta vr_enable 1
seta vr_verbose 1

// Engine console log, written next to the executable as qconsole.log.
//
// vr.log is ours and only carries what we chose to write; qconsole.log is
// the ENGINE's, and it captures Com_Error text, VM load failures and the
// last thing printed before a crash -- none of which vr.log can see. On a
// device with no debugger, a crash that leaves no qconsole.log behind costs
// a whole round trip to learn nothing.
//
// 2 means flush every line, so a hard crash cannot take the tail with it.
seta logfile 2

echo "Tremulous WXR: VR enabled, verbose logging on, console logged to qconsole.log"
echo "If anything goes wrong, send BOTH vr.log and qconsole.log."
