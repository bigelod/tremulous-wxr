// Tremulous WXR - AlphaTest build defaults.
//
// autoexec.cfg is exec'd by Com_ExecuteCfg AFTER default.cfg and
// q3config.cfg, so it wins over a saved config on the test device -- which
// is the usual reason a changed default appears not to take effect.
//
// vr_enable is CVAR_LATCH, and this runs before CL_Init, so it latches in
// time for the XrApi client to start on the first frame.
//
// The compiled-in default stays 0 on purpose: the project rule is that
// `vr_enable 0` produces a bit-identical flat game, and a test build turning
// VR on for convenience should not quietly rewrite that guarantee. Delete
// this file and you have the stock game back.

seta vr_enable 1
seta vr_verbose 1

// Engine console log, written next to the executable as qconsole.log.
//
// vr.log is ours and only carries what we chose to write; qconsole.log is
// the ENGINE's, and it captures Com_Error text, VM load failures and the
// last thing printed before a crash -- none of which vr.log can see. On a
// device with no debugger, a crash that leaves no qconsole.log behind costs
// a whole round trip to learn nothing.
//
// 2 means flush every line, so a hard crash cannot take the tail with it.
seta logfile 2

echo "Tremulous WXR: VR enabled, verbose logging on, console logged to qconsole.log"
echo "If anything goes wrong, send BOTH vr.log and qconsole.log."

// ---------------------------------------------------------------------
// The HUD's control tutorial, off.
//
// cg_tutorial defaults to 1 and draws the "Press %s to swipe" hints over
// the HUD. CG_KeyBinding fills in %s from the KEY actually bound, so with
// our synthetic keys the text is technically CORRECT and practically
// useless: it tells a player wearing a headset to press MOUSE1 or ENTER.
// It also costs HUD space, which is the scarcest thing on screen in VR.
//
// A cvar, not a code change -- cg_tutorial belongs to cgame, and cgame is a
// QVM a pure server replaces, so touching it in code would not survive a
// real server. Setting it here does, because cvars are the engine's.
//
// Delete this line to get the hints back; it is CVAR_ARCHIVE, so also unset
// it on the device with "seta cg_tutorial 1" if you want them for a round.
seta cg_tutorial 0

// ---------------------------------------------------------------------
// Sprint.
//
// Tremulous ships Sprint UNBOUND. Its own HUD says so outright -- the
// tutorial text reads: Press "Sprint" (unbound) and any direction to sprint.
// cg_tutorial.c's binding table is unambiguous about these being two
// different controls:
//
//     { "+speed",   "Run/Walk" }     <- a walk modifier
//     { "+button8", "Sprint"   }     <- BUTTON_SPRINT, burns stamina
//
// AlphaTest7 mapped the stick click to +speed, which was the wrong one. So
// bind the real thing and point the VR control at it. HOME is unused in the
// stock default.cfg.
//
// The seta is NOT redundant: vr_key_sprint is CVAR_ARCHIVE and AlphaTest7
// will already have saved "SHIFT" into autogen.cfg, which would otherwise
// beat the new compiled-in default. autoexec runs last and wins.
bind HOME +button8
seta vr_key_sprint "HOME"

// ---------------------------------------------------------------------
// The engine-side VR settings menu.
//
// F1 is a desktop convenience; on the headset the dominant stick click opens
// it (vr_menuButton -1 = auto). The menu is drawn by the client, not by
// ui.qvm, so a pure server cannot take it away. Nothing is required here for
// the controller path -- this bind only exists so the panel can be opened
// while testing at a desk.
bind F1 vr_menu
