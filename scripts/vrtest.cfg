// Unattended test: spectator -> humans -> spawned rifle human.
//
// For HUMANS, `class` takes a WEAPON name, not a class name -- Cmd_Class_f
// matches against BG_Weapon(WP_MACHINEGUN)->name, which is "rifle". Passing
// a class name such as human_base only queues you and then opens the
// weapon-choice menu, which needs a mouse.
//
// `wait` counts FRAMES, not milliseconds.
wait 400
team humans
wait 200
class rifle
wait 400
