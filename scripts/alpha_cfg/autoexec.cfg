// Tremulous WXR - AlphaTest4 defaults.
//
// autoexec.cfg is exec'd AFTER default.cfg and q3config.cfg, so it also
// beats a saved config on the device - the usual reason a changed default
// appears not to take effect.

seta vr_enable 1
seta vr_verbose 1

// Engine console log -> base/qconsole.log, flushed per line. Carries
// Com_Error text and the last line before a crash, which vr.log cannot see.
seta logfile 2

// ---------------------------------------------------------------------
// QVM EXECUTION MODE - this is the change being tested in AlphaTest4.
//
// The engine defaults these to 2, which is the JIT: vm_x86.c GENERATES
// x86-64 machine code at runtime and jumps into it. On the Quest our x86-64
// binary is already being emulated by Box64, so that asks Box64's dynarec to
// translate code that did not exist when the process started. Runtime-
// generated code is the classic hard case for any dynarec, and it fits the
// symptom: the main menu works (small ui.qvm) and hosting a game dies, which
// is where the much larger game.qvm and cgame.qvm load.
//
// 1 is the bytecode interpreter. It generates no code at all, so there is
// nothing for the dynarec to trip over. It is slower than the JIT, and that
// is a trade worth making for a build that runs.
//
// This does NOT cost us multiplayer: pure servers accept VMI_BYTECODE, see
// cl_ui.c -- only modes that are neither compiled nor bytecode get forced.
//
// To go back to the JIT, copy autoexec_vm_jit.cfg over this file.
// To use the native DLLs instead, copy autoexec_vm_native.cfg over it.
// ---------------------------------------------------------------------

seta vm_game 1
seta vm_cgame 1
seta vm_ui 1

echo "Tremulous WXR: VR on, verbose log on, QVMs in BYTECODE mode (no JIT)"
echo "Logs: vr.log next to the exe, qconsole.log in base/. Send BOTH."
